<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register &mdash; Nook</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="/index.html" class="brand">Nook</a>
    <nav class="main-nav" id="nav-auth"></nav>
  </div>
</header>

<div class="form-card">
  <h1>Create an account</h1>
  <div id="form-alert"></div>
  <form id="register-form">
    <div class="field"><label for="username">Username</label><input type="text" id="username" pattern="[a-zA-Z0-9_]{3,20}" required autofocus></div>
    <div class="field"><label for="email">Email</label><input type="email" id="email" required></div>
    <div class="field"><label for="bio">Bio (optional)</label><textarea id="bio" maxlength="160"></textarea></div>
    <div class="field"><label for="password">Password</label><input type="password" id="password" minlength="6" required></div>
    <button type="submit" class="btn btn-primary btn-block">Create account</button>
  </form>
  <p class="form-note">Already have an account? <a href="/login.html" style="text-decoration:underline;">Log in</a></p>
</div>

<script src="/js/nav.js"></script>
<script>
  document.getElementById('register-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = document.getElementById('username').value;
    const email = document.getElementById('email').value;
    const bio = document.getElementById('bio').value;
    const password = document.getElementById('password').value;
    const res = await fetch('/api/auth/register', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, email, password, bio })
    });
    const data = await res.json();
    if (!res.ok) {
      document.getElementById('form-alert').innerHTML = `<div class="alert alert-error">${escapeHtml(data.error)}</div>`;
      return;
    }
    window.location.href = '/index.html';
  });
</script>
</body>
</html>
